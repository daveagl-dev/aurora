@if (ui.quickViewProduct(); as product) {
  <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white max-w-3xl w-full rounded shadow-2xl overflow-hidden relative grid grid-cols-1 md:grid-cols-2 animate-scaleUp">
      <button (click)="close()" class="absolute top-4 right-4 z-10 bg-white/80 p-1 rounded-full text-[#111]" aria-label="Close quick view">
        <app-icon name="x" cls="w-5 h-5" />
      </button>
      <img [src]="product.images[0]" alt="" class="w-full h-80 md:h-full object-cover" />
      <div class="p-6 space-y-4 flex flex-col justify-between">
        <div>
          <span class="text-[10px] tracking-[0.2em] uppercase text-[#C5A059]">{{ product.category }}</span>
          <h3 class="font-serif text-2xl text-[#111]">{{ product.name }}</h3>
          <p class="text-lg text-[#C5A059] font-semibold mt-1">{{ currency.format(product.price) }}</p>
          <p class="text-xs text-[#666] mt-3 leading-relaxed font-light line-clamp-3">{{ product.description }}</p>
        </div>

        <div class="space-y-3">
          <button
            (click)="addToBag()"
            class="w-full bg-[#0D0D0D] text-white hover:bg-[#C5A059] py-3 text-xs uppercase tracking-widest font-semibold transition-colors"
          >
            Add To Bag
          </button>
          <button
            (click)="viewProduct()"
            class="w-full border border-[#EAE8E4] py-2.5 text-xs text-[#555] uppercase tracking-wider hover:border-black"
          >
            View Product Page
          </button>
        </div>
      </div>
    </div>
  </div>
}
